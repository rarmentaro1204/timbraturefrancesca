<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Timbrature · Gestione</title>
<style>
  :root { --bg:#f4f6f8; --fg:#1b2430; --card:#fff; --in:#1e9e5a; --out:#d9443a; --mut:#6b7684; --line:#e3e7ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161c; --fg:#eef1f5; --card:#1d242d; --mut:#9aa5b2; --line:#2c3541; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); padding:16px; }
  main { max-width:720px; margin:0 auto; }
  h1 { font-size:1.2rem; margin:0 0 12px; }
  h2 { font-size:1.1rem; margin:0; }
  .card { background:var(--card); border-radius:14px; padding:14px 16px; margin-bottom:16px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .tot { font-size:1.5rem; font-weight:700; }
  .sub { color:var(--mut); font-size:.9rem; margin:2px 0 10px; }
  .day { border-top:1px solid var(--line); padding:8px 0; }
  .day-row { display:grid; grid-template-columns: 86px 1fr auto; gap:8px; align-items:center; cursor:pointer; }
  .day-row b { font-variant-numeric: tabular-nums; }
  .fasce { color:var(--mut); font-size:.9rem; }
  .bad { background:rgba(217,68,58,.12); border-radius:8px; padding:2px 6px; }
  .flag { color:var(--out); font-size:.8rem; font-weight:600; }
  .ts { display:none; margin:8px 0 2px 0; }
  .day.open .ts { display:block; }
  .t { display:flex; justify-content:space-between; align-items:center; padding:6px 8px; border-radius:8px; background:var(--bg); margin-top:4px; }
  .in { color:var(--in); font-weight:600; } .out { color:var(--out); font-weight:600; }
  button { font:inherit; border:0; border-radius:10px; padding:8px 14px; cursor:pointer; background:var(--in); color:#fff; font-weight:600; }
  button.sec { background:var(--bg); color:var(--fg); border:1px solid var(--line); }
  button.del { background:var(--out); }
  button.sm { padding:4px 10px; font-size:.85rem; }
  input, select { font:inherit; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); width:100%; }
  label { display:block; margin:10px 0 4px; color:var(--mut); font-size:.85rem; }
  dialog { border:0; border-radius:14px; background:var(--card); color:var(--fg); width:min(92vw,380px); padding:18px; }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  .btns { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  #err { color:var(--out); font-weight:600; margin:8px 0; min-height:1.2em; }
  #login { max-width:320px; margin:12vh auto; }
</style>
</head>
<body>
<main>
  <div id="login" class="card">
    <h1>Gestione timbrature</h1>
    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
    <div id="loginErr" style="color:var(--out);margin-top:8px;min-height:1.2em"></div>
    <div class="btns"><button id="entra">Entra</button></div>
  </div>

  <div id="app" hidden>
    <div class="head" style="margin-bottom:12px">
      <h1>Gestione timbrature</h1>
      <button class="sec sm" id="esci">Esci</button>
    </div>
    <div id="err"></div>
    <div id="mesi"></div>
  </div>
</main>

<dialog id="dlg">
  <h2 id="dlgTitolo">Timbratura</h2>
  <label for="fData">Data</label><input id="fData" type="date">
  <label for="fOra">Ora</label><input id="fOra" type="time">
  <label for="fTipo">Tipo</label>
  <select id="fTipo"><option>ENTRATA</option><option>USCITA</option></select>
  <div id="dlgErr" style="color:var(--out);margin-top:8px;min-height:1.2em"></div>
  <div class="btns">
    <button id="salva">Salva</button>
    <button id="elimina" class="del">Elimina</button>
    <button id="annulla" class="sec">Annulla</button>
  </div>
</dialog>

<script src="config.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  var pin = '', riga = null, aperti = {};
  try { pin = sessionStorage.getItem('pin') || ''; } catch (e) {}

  function hm(min) { return Math.floor(min / 60) + 'h ' + String(min % 60).padStart(2, '0') + 'm'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
  function dmy(g) { var p = g.split('-'); return p[2] + '/' + p[1]; }

  function api(payload) {
    if (!window.API_URL) return Promise.reject(new Error('Manca API_URL in config.js'));
    payload.pin = pin;
    return fetch(window.API_URL, { method: 'POST', body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j.errore) throw new Error(j.errore); return j; });
  }

  function render(d) {
    $('mesi').innerHTML = d.mesi.map(function (m) {
      var giorni = m.giorni.slice().reverse().map(function (g) {
        var key = g.giorno;
        var ts = g.timbrature.map(function (t) {
          return '<div class="t"><span><span class="' + (t.tipo === 'ENTRATA' ? 'in' : 'out') + '">' + t.tipo + '</span> · ' + t.ora + '</span>' +
                 '<button class="sec sm" data-edit="' + t.riga + '" data-g="' + key + '" data-o="' + t.ora + '" data-t="' + t.tipo + '">Modifica</button></div>';
        }).join('');
        var flag = g.inCorso ? '<span class="flag" style="color:var(--mut)">in corso</span>'
                 : g.incompleto ? '<span class="flag">manca timbratura</span>' : '';
        return '<div class="day' + (aperti[key] ? ' open' : '') + '" data-day="' + key + '">' +
          '<div class="day-row' + (g.incompleto && !g.inCorso ? ' bad' : '') + '">' +
          '<b>' + dmy(key) + ' ' + esc(g.giornoSettimana.substring(0, 3)) + '</b>' +
          '<span class="fasce">' + esc(g.fasce) + ' ' + flag + '</span><b>' + hm(g.minuti) + '</b></div>' +
          '<div class="ts">' + ts + '<div style="margin-top:6px"><button class="sec sm" data-add="' + key + '">+ Aggiungi a questo giorno</button></div></div></div>';
      }).join('') || '<div class="sub">Nessuna timbratura</div>';
      return '<section class="card"><div class="head"><h2>' + esc(m.nome) + '</h2><span class="tot">' + hm(m.minuti) + '</span></div>' +
             '<div class="sub">' + m.giorniLavorati + ' giorni lavorati</div>' + giorni +
             '<div style="margin-top:12px"><button data-add="' + (m.mese === d.oggi.substring(0, 7) ? d.oggi : m.mese + '-01') + '">+ Aggiungi timbratura</button></div></section>';
    }).join('');
  }

  // Una GET non scrive mai nel foglio: serve a capire se lo script è aggiornato prima di inviare il PIN.
  function controllaVersione() {
    return fetch(window.API_URL + '?action=versione').then(function (r) { return r.json(); }).then(function (j) {
      if (!j.versione) throw new Error('Lo script non è aggiornato: incolla il codice nuovo e pubblica una "Nuova versione".');
    });
  }

  function carica() {
    $('err').textContent = '';
    return controllaVersione().then(function () { return api({ action: 'dati' }); }).then(function (d) {
      if (!d || !d.mesi) throw new Error('Risposta non valida dallo script');
      $('login').hidden = true; $('app').hidden = false;
      try { sessionStorage.setItem('pin', pin); } catch (e) {}
      render(d);
    }).catch(function (e) {
      if (!$('app').hidden) { $('err').textContent = e.message; return; }
      $('loginErr').textContent = e.message;
    });
  }

  function apri(titolo, r, g, o, t) {
    riga = r;
    $('dlgTitolo').textContent = titolo;
    $('fData').value = g; $('fOra').value = o || ''; $('fTipo').value = t || 'ENTRATA';
    $('elimina').hidden = !r; $('dlgErr').textContent = '';
    $('dlg').showModal();
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target;
    if (el.dataset.edit) return apri('Modifica timbratura', el.dataset.edit, el.dataset.g, el.dataset.o, el.dataset.t);
    if (el.dataset.add) return apri('Aggiungi timbratura', null, el.dataset.add, '', 'ENTRATA');
    var row = el.closest('.day-row');
    if (row) { var day = row.parentNode; day.classList.toggle('open'); aperti[day.dataset.day] = day.classList.contains('open'); }
  });

  function invia(payload) {
    $('dlgErr').textContent = '';
    return api(payload).then(function (d) { $('dlg').close(); render(d); })
      .catch(function (e) { $('dlgErr').textContent = e.message; });
  }
  $('salva').onclick = function () {
    var p = { action: riga ? 'modifica' : 'aggiungi', data: $('fData').value, ora: $('fOra').value, tipo: $('fTipo').value };
    if (riga) p.riga = riga;
    if (!p.data || !p.ora) { $('dlgErr').textContent = 'Inserisci data e ora'; return; }
    invia(p);
  };
  $('elimina').onclick = function () { if (confirm('Eliminare questa timbratura?')) invia({ action: 'elimina', riga: riga }); };
  $('annulla').onclick = function () { $('dlg').close(); };
  $('entra').onclick = function () { pin = $('pin').value; carica(); };
  $('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('entra').click(); });
  $('esci').onclick = function () { try { sessionStorage.removeItem('pin'); } catch (e) {} location.reload(); };

  if (pin) carica();
</script>
</body>
</html>
